<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="經期日誌">
<title>經期日誌 — 離線雙人同步</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- 【功能】全部樣式自己寫，唔用 CDN
     【原因】要 100% 離線；CDN 一斷線就變成冇樣式
     【修改指引】顏色統一改上面 :root 變數 -->
<style>
:root{
  --bg:#FAF7F5; --card:#FFFFFF; --ink:#1F2937; --ink-2:#4B5563; --ink-3:#9CA3AF;
  --line:#F1E7E7; --rose-50:#FFF5F7; --rose-100:#FFE4E9; --rose-200:#FECDD3;
  --rose-500:#F43F5E; --rose-600:#E11D48; --rose-700:#BE123C;
  --green:#10B981; --amber:#F59E0B; --soft:#F8FAFC;
  /* 【功能】面板同邊框色（深色模式要一齊轉） */
  --panel:#F8FAFC; --panel-2:#FFFFFF; --line2:#E5E7EB; --cellbg:rgba(248,250,252,.5);
}
/* 【功能】深色模式（跟系統，或手動切換）
   【原因】夜晚睇唔刺眼；用 CSS 變數統一改，唔需要逐個元素改
   【修改指引】要調色改呢兩組變數 */
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1115; --card:#161A20; --ink:#E8EAED; --ink-2:#B6BDC8; --ink-3:#7C8494;
    --line:#252B34; --rose-50:#241A1E; --rose-100:#2C1F24; --rose-200:#3A2A31;
    --soft:#1B2029;
    --panel:#1B2029; --panel-2:#232A35; --line2:#2A3038; --cellbg:rgba(255,255,255,.045);
  }
}
[data-theme="dark"]{
  --bg:#0F1115; --card:#161A20; --ink:#E8EAED; --ink-2:#B6BDC8; --ink-3:#7C8494;
  --line:#252B34; --rose-50:#241A1E; --rose-100:#2C1F24; --rose-200:#3A2A31;
  --soft:#1B2029;
  --panel:#1B2029; --panel-2:#232A35; --line2:#2A3038; --cellbg:rgba(255,255,255,.045);
}
[data-theme="light"]{
  --bg:#FAF7F5; --card:#FFFFFF; --ink:#1F2937; --ink-2:#4B5563; --ink-3:#9CA3AF;
  --line:#F1E7E7; --rose-50:#FFF5F7; --rose-100:#FFE4E9; --rose-200:#FECDD3;
  --soft:#F8FAFC;
  --panel:#F8FAFC; --panel-2:#FFFFFF; --line2:#E5E7EB; --cellbg:rgba(248,250,252,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;
  font-size:14px; line-height:1.5; display:flex; justify-content:center; align-items:flex-start;
  padding:0; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
.shell{
  width:100%; max-width:430px; min-height:100vh; background:var(--card);
  display:flex; flex-direction:column; position:relative; overflow:hidden;
}
@media (min-width:640px){
  body{padding:24px 0}
  .shell{min-height:auto; border-radius:26px; box-shadow:0 18px 40px rgba(31,41,55,.10); border:1px solid var(--line)}
}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
button:disabled{opacity:.45; cursor:default}

/* ---------- 頂欄 ---------- */
header{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 12px;
  border-bottom:1px solid var(--rose-100)}
.brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; letter-spacing:-.2px}
.hbtns{display:flex; align-items:center; gap:8px}
.pill{display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
  background:var(--rose-50); color:var(--rose-600); font-weight:700; font-size:12px;
  box-shadow:0 1px 2px rgba(225,29,72,.08)}
.pill:active{transform:scale(.96)}
.iconbtn{width:32px; height:32px; border-radius:999px; display:flex; align-items:center;
  justify-content:center; color:var(--ink-3); font-size:15px}
.iconbtn:hover{color:var(--ink-2); background:#f7f7f8}

/* ---------- 設定抽屜 ---------- */
.drawer{padding:10px 16px 14px; background:var(--panel); border-bottom:1px solid var(--line2);
  display:none; flex-direction:column; gap:8px; font-size:12px; color:var(--ink-2)}
.drawer.open{display:flex}
.drawer .row{display:flex; align-items:center; justify-content:space-between}
.drawer input[type=number]{width:64px; padding:5px 6px; text-align:center; font-weight:700;
  border:1px solid var(--line2); border-radius:10px; background:var(--panel-2); color:var(--ink)}
.drawer .hint{font-size:11px; color:var(--ink-3)}
.drawer .acts{display:flex; gap:8px; flex-wrap:wrap; padding-top:4px}
.sbtn{padding:7px 10px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line2);
  font-size:11.5px; font-weight:700; color:var(--ink-2)}
.sbtn.danger{color:#B91C1C; border-color:#FECACA; background:#FEF2F2}

/* ---------- 圖例 ---------- */
.legend{display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:5px 12px; padding:7px 10px;
  background:var(--rose-50); border-bottom:1px solid var(--line);
  font-size:10.5px; color:var(--ink-2)}
.legend span.item{display:flex; align-items:center; gap:4px}
.legend .pred{opacity:.35}

/* ---------- 月份切換 ---------- */
.monthbar{display:flex; align-items:center; justify-content:space-between; padding:12px 16px}
.nav{display:flex; align-items:center; gap:10px}
.navbtn{width:32px; height:32px; border-radius:999px; background:var(--panel); color:var(--ink-2);
  display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700}
.navbtn:active{transform:scale(.94)}
.mlabel{font-weight:700; font-size:15px; min-width:112px; text-align:center}
.todaybtn{padding:5px 12px; border-radius:999px; background:var(--rose-50); color:var(--rose-600);
  font-weight:700; font-size:12px}

/* ---------- 星期 ---------- */
.weekhead{display:grid; grid-template-columns:repeat(7,1fr); text-align:center;
  font-size:11px; font-weight:700; color:var(--ink-3); padding:4px 0 6px;
  border-bottom:1px solid var(--line)}
.weekhead .we{color:var(--rose-500)}

/* ---------- 日曆格 ---------- */
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:8px}
.cell{min-height:58px; border-radius:14px; border:1px solid transparent; background:var(--cellbg);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:5px 2px 3px; transition:background .15s, border-color .15s}
.cell.empty{background:transparent; border:none}
.cell.haslog{background:var(--card); border-color:var(--line); box-shadow:0 1px 2px rgba(31,41,55,.05)}
.cell.today{box-shadow:0 0 0 2px var(--rose-500); background:rgba(255,245,247,.5)}
.cell:hover{border-color:var(--line2)}
/* 【功能】多日選取時嘅高亮
   【原因】用戶要睇清楚掃咗邊幾日
   【修改指引】唔需要改 */
.cell.sel{background:var(--rose-100); border-color:var(--rose-200)}
/* 【功能】易孕期（藍框）／相對低機會（綠框）／排卵日（圓點）
   【原因】用 outline 而唔用 box-shadow，避免同「今日」個框衝突
   【修改指引】改顏色改呢兩行 */
.cell.fertile{outline:2px solid #3B82F6; outline-offset:-2px; background:rgba(59,130,246,.07)}
.cell.safe{outline:2px dashed #10B981; outline-offset:-2px; background:rgba(16,185,129,.06)}
.ovu{position:absolute; top:5px; right:5px; width:6px; height:6px; border-radius:50%;
  background:#7C3AED; box-shadow:0 0 0 1.5px var(--card)}
.cell{position:relative}
.dnum{font-size:12px; font-weight:700; color:var(--ink)}
.cell.today .dnum{color:var(--rose-600)}
.drop{font-size:15px; line-height:1}
.drop.pred{opacity:.35}
.badges{display:flex; gap:1px; height:12px; font-size:10px; align-items:center}

/* ---------- 底部預測 ---------- */
footer{padding:12px 16px 16px; border-top:1px solid var(--line); background:var(--panel);
  text-align:center; margin-top:auto}
#predText{font-size:12px; color:var(--ink-2); line-height:1.65; margin:0}
#predText b{color:var(--rose-600)}
#predText .sub{display:block; font-size:10.5px; color:var(--ink-3); margin-top:2px}
#storageNote{margin:8px 0 0; font-size:10.5px; color:var(--ink-3); line-height:1.7}
#storageNote b{color:var(--ink-2)}

/* ---------- 彈窗（底部彈出） ---------- */
.overlay{position:fixed; inset:0; background:rgba(15,23,42,.42); backdrop-filter:blur(3px);
  z-index:40; display:flex; align-items:flex-end; justify-content:center; padding:0}
@media (min-width:640px){ .overlay{align-items:center} }
.overlay[hidden]{display:none}
.sheet{width:100%; max-width:430px; background:var(--card); border-radius:22px 22px 0 0;
  padding:18px 18px 20px; max-height:88vh; overflow-y:auto;
  animation:up .18s ease-out}
@media (min-width:640px){ .sheet{border-radius:22px} }
@keyframes up{from{transform:translateY(16px); opacity:.6} to{transform:none; opacity:1}}
.sheethead{display:flex; align-items:flex-start; justify-content:space-between;
  border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:12px}
.sheethead h2{margin:0; font-size:15px; font-weight:700}
.sheethead .sub{margin:2px 0 0; font-size:11px; color:var(--ink-3)}
.xbtn{width:30px; height:30px; border-radius:999px; background:var(--panel); color:var(--ink-3);
  display:flex; align-items:center; justify-content:center}
.label{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.4px; margin:10px 0 6px}

/* 勾選行 */
.checkrow{display:flex; align-items:center; justify-content:space-between; padding:11px 13px;
  border:1px solid var(--line2); border-radius:15px; background:var(--panel); margin-bottom:7px}
.checkrow .left{display:flex; align-items:center; gap:9px; font-weight:700; font-size:13px}
.checkrow input[type=checkbox]{width:19px; height:19px; accent-color:var(--rose-500)}
.checkrow.on{border-color:var(--rose-500); background:var(--rose-50)}
/* 【功能】安全性行為用綠色、不安全性行為用琥珀色
   【原因】單靠玫瑰色分辨唔到三種標記，顏色語意更清楚
   【修改指引】唔需要改 */
#rowSafe.on{border-color:var(--green); background:#ECFDF5}
#rowSafe.on input{accent-color:var(--green)}
#rowUnsafe.on{border-color:var(--amber); background:#FFFBEB}
#rowUnsafe.on input{accent-color:var(--amber)}

/* 流量 */
.flow{display:none; margin:0 0 8px 12px; padding:8px 0 4px 12px; border-left:2px solid var(--rose-200)}
.flow.show{display:block}
.flow .row{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:6px}
.fbtn{padding:8px 4px; border-radius:11px; border:1px solid var(--line2); background:var(--panel-2);
  font-size:12px; font-weight:700; color:var(--ink-2)}
.fbtn[aria-pressed="true"]{border-color:var(--rose-500); background:var(--rose-50); color:var(--rose-600)}

textarea{width:100%; padding:11px; border:1px solid var(--line2); border-radius:14px;
  font:inherit; font-size:12.5px; color:var(--ink); background:var(--panel);
  resize:vertical; outline:none}
textarea:focus{border-color:var(--rose-500)}
.acts{display:flex; gap:9px; margin-top:14px}
.btn{padding:12px 16px; border-radius:15px; font-weight:700; font-size:13px; border:none}
.btn.del{background:var(--panel); color:var(--ink-2)}
.btn.primary{flex:1; background:var(--rose-500); color:#fff; box-shadow:0 6px 14px rgba(244,63,94,.25)}
.btn.primary:active{transform:scale(.99)}
.btn.ghost{background:var(--rose-50); color:var(--rose-600)}

/* 同步分頁 */
.tabs{display:flex; border-bottom:1px solid var(--line); margin-bottom:12px}
.tab{flex:1; padding:9px 0; font-size:12px; font-weight:700; color:var(--ink-3);
  border-bottom:2px solid transparent}
.tab.on{color:var(--rose-600); border-bottom-color:var(--rose-500)}
.syncmsg{font-size:12px; color:var(--ink-2); min-height:18px; margin:8px 0 0; text-align:center}
.syncmsg.err{color:#B91C1C}
.codewrap{margin-top:8px}
.codewrap textarea{font-family:ui-monospace,Menlo,monospace; font-size:10.5px; word-break:break-all}
.rowbtns{display:flex; gap:8px; margin-top:8px}
.rowbtns .btn{flex:1}
.pin{display:flex; gap:8px; align-items:center; margin-top:8px}
.pin input{width:96px; padding:9px 10px; border:1px solid var(--line2); border-radius:12px;
  text-align:center; font-weight:700; letter-spacing:3px}

/* Toast */
#toast{position:fixed; left:50%; top:64px; transform:translateX(-50%);
  background:rgba(31,41,55,.92); color:#fff; font-size:12px; padding:9px 16px;
  border-radius:999px; z-index:60; pointer-events:none; transition:opacity .25s; opacity:1}
#toast[hidden]{display:none}
</style>
</head>
<body>
<div class="shell">

  <!-- 【功能】頂欄：標題、雙人同步、設定
       【原因】CEO 規格：Top bar 要有月份、同步 🔗、設定 ⚙️
       【修改指引】唔需要改 -->
  <header>
    <div class="brand"><span>🌸</span><span data-i18n="app.brand">經期日誌</span></div>
    <div class="hbtns">
      <button class="pill" id="syncBtn" type="button" data-i18n="header.sync">🔗 雙人同步</button>
      <!-- 【功能】主題切換（跟系統 → 深色 → 淺色）
           【原因】CEO 要求俾用戶自己揀
           【修改指引】唔需要改 -->
      <button class="iconbtn" id="themeIcon" type="button" data-i18n-title="header.theme" aria-label="切換主題">🌓</button>
      <button class="iconbtn" id="settingsBtn" type="button" data-i18n-title="header.settings" aria-label="設定">⚙️</button>
    </div>
  </header>

  <div class="drawer" id="drawer">
    <div class="row"><span data-i18n="drawer.lang">語言</span>
      <select id="langSel" style="padding:5px 8px;border:1px solid var(--line2);border-radius:10px;
        background:var(--panel-2);color:var(--ink);font-size:12px"></select></div>
    <div class="row"><span data-i18n="drawer.cycle">預設週期（日）</span><input type="number" id="setCycle" min="15" max="90" value="28"></div>
    <div class="row"><span data-i18n="drawer.periodLen">預設經期長度（日）</span><input type="number" id="setPeriod" min="1" max="15" value="5"></div>
    <p class="hint" id="setInfo"></p>
    <div class="row"><span data-i18n="drawer.showFert">顯示易孕期／排卵日</span><input type="checkbox" id="setFertility" checked
      style="width:18px;height:18px;accent-color:var(--rose-500)"></div>
    <div class="row"><span data-i18n="drawer.backupPin">備份 PIN（可留空）</span><input type="password" id="backupPin" maxlength="4" placeholder="••••"
      style="width:80px;letter-spacing:3px;text-align:center"></div>
    <div class="acts">
      <button class="sbtn" id="saveSettings" type="button" data-i18n="drawer.save">儲存設定</button>
      <button class="sbtn" id="themeBtn" type="button">主題：跟系統</button>
      <button class="sbtn" id="exportBtn" type="button" data-i18n="drawer.export">匯出備份</button>
      <button class="sbtn" id="importBtn" type="button" data-i18n="drawer.import">匯入備份</button>
      <button class="sbtn danger" id="clearAllBtn" type="button" data-i18n="drawer.clear">清除本機紀錄</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <!-- 【功能】圖例
       【原因】用戶要知每個小標記代表咩
       【修改指引】唔需要改 -->
  <div class="legend">
    <span class="item" data-i18n="legend.period">🩸 月經</span>
    <span class="item pred" data-i18n="legend.predicted">🩸 預測</span>
    <span class="item" data-i18n="legend.safe">🛡️ 安全</span>
    <span class="item" data-i18n="legend.unsafe">⚠️ 不安全</span>
    <span class="item" data-i18n="legend.note">💬 備註</span>
    <span class="item"><i style="display:inline-block;width:11px;height:11px;border:2px solid #3B82F6;border-radius:3px"></i> <span data-i18n="legend.fertile">易孕</span></span>
    <span class="item"><i style="display:inline-block;width:11px;height:11px;border:2px dashed #10B981;border-radius:3px"></i> <span data-i18n="legend.lowChance">低機會</span></span>
    <span class="item"><i style="display:inline-block;width:6px;height:6px;background:#7C3AED;border-radius:50%"></i> <span data-i18n="legend.ovulation">排卵</span></span>
  </div>

  <div class="monthbar">
    <div class="nav">
      <button class="navbtn" id="prevBtn" type="button" aria-label="上個月">‹</button>
      <div class="mlabel" id="monthLabel">—</div>
      <button class="navbtn" id="nextBtn" type="button" aria-label="下個月">›</button>
    </div>
    <button class="todaybtn" id="todayBtn" type="button" data-i18n="month.today">今天</button>
  </div>

  <div class="weekhead" id="weekhead">
    <div class="we">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="we">六</div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <p id="predText">分析中…</p>
    <!-- 【功能】資料存放聲明
         【原因】CEO 要求喺底部講清楚紀錄存喺邊、要備份就匯出
         【修改指引】唔需要改 -->
    <p id="fertilityNote" data-i18n-html="footer.fertNote" hidden style="margin:8px 0 0;font-size:10.5px;color:var(--ink-3);line-height:1.7"></p>
    <p id="storageNote" data-i18n-html="footer.storage"></p>
  </footer>
</div>

<!-- 【功能】每日記錄彈窗
     【原因】CEO 規格：撳日期開彈窗，勾選＋流量＋備註＋儲存／刪除
     【修改指引】唔需要改 -->
<div class="overlay" id="dayModal" hidden>
  <div class="sheet">
    <div class="sheethead">
      <div>
        <h2 id="dayTitle">—</h2>
        <p class="sub" id="modalSub" data-i18n="modal.sub">勾選或寫備註，撳「儲存」</p>
      </div>
      <button class="xbtn" id="cancelDay" type="button" aria-label="關閉">✕</button>
    </div>

    <div class="label" data-i18n="label.marks">標記</div>
    <label class="checkrow" id="rowPeriod">
      <span class="left"><span>🩸</span><span data-i18n="mark.period">月經</span></span>
      <input type="checkbox" id="cbPeriod">
    </label>

    <div class="flow" id="flowRow">
      <div class="label" data-i18n="label.flow" style="margin-top:0">流量</div>
      <div class="row">
        <button class="fbtn" type="button" data-flow="heavy" aria-pressed="false" data-i18n="flow.heavy">多</button>
        <button class="fbtn" type="button" data-flow="normal" aria-pressed="true" data-i18n="flow.normal">正常</button>
        <button class="fbtn" type="button" data-flow="light" aria-pressed="false" data-i18n="flow.light">小</button>
      </div>
    </div>

    <label class="checkrow" id="rowSafe">
      <span class="left"><span>🛡️</span><span data-i18n="mark.safeSex">安全性行為</span></span>
      <input type="checkbox" id="cbSafe">
    </label>
    <label class="checkrow" id="rowUnsafe">
      <span class="left"><span>⚠️</span><span data-i18n="mark.unsafeSex">不安全性行為</span></span>
      <input type="checkbox" id="cbUnsafe">
    </label>

    <div class="label" id="remarkLabel" data-i18n="label.note">備註</div>
    <textarea id="remark" rows="2" data-i18n-ph="note.ph" placeholder="症狀、心情或者其他記事…"></textarea>

    <div class="acts">
      <button class="btn del" id="clearDay" type="button" data-i18n="btn.del">刪除</button>
      <button class="btn primary" id="saveDay" type="button" data-i18n="btn.save">儲存</button>
    </div>
  </div>
</div>

<!-- 【功能】同步彈窗
     【原因】產生／貼上同步碼做合併（QR 已按 CEO 指示移除）
     【修改指引】唔需要改 -->
<div class="overlay" id="syncModal" hidden>
  <div class="sheet">
    <div class="sheethead">
      <div>
        <h2 data-i18n="sync.title">🔗 雙人離線同步</h2>
        <p class="sub" data-i18n="sync.sub">點對點傳資料，唔經任何伺服器</p>
      </div>
      <button class="xbtn" id="closeSync" type="button" aria-label="關閉">✕</button>
    </div>

    <div class="tabs">
      <button class="tab on" id="tabGen" type="button" data-i18n="sync.tabGen">① 產生同步碼</button>
      <button class="tab" id="tabMerge" type="button" data-i18n="sync.tabMerge">② 合併對方資料</button>
    </div>

    <div id="paneGen">
      <p class="hint" data-i18n-html="sync.genHint" style="font-size:12px;color:var(--ink-2);margin:0 0 4px"></p>
      <div class="pin">
        <span style="font-size:12px" data-i18n="sync.pinOptional">PIN（可留空）</span>
        <input type="password" id="genPin" inputmode="numeric" maxlength="4" placeholder="••••">
      </div>
      <div class="rowbtns">
        <button class="btn ghost" id="genSync" type="button" data-i18n="sync.gen">產生同步碼</button>
      </div>
      <div class="codewrap" id="syncOutWrap" hidden>
        <textarea id="syncOut" rows="4" readonly></textarea>
        <div class="rowbtns">
          <button class="btn ghost" id="copySync" type="button" data-i18n="sync.copy">複製碼</button>
          <button class="btn ghost" id="copyLink" type="button" data-i18n="sync.copyLink">複製連結</button>
          <button class="btn ghost" id="shareSync" type="button" data-i18n="sync.share">分享</button>
        </div>
        <p class="hint" style="font-size:11px;color:var(--ink-3);margin:8px 0 0;border-top:1px dashed var(--line);padding-top:8px">
          <span data-i18n-html="sync.method2"></span>
          <button class="sbtn" id="openBackup" type="button" data-i18n="sync.goBackup" style="margin-top:6px">去備份／匯入</button>
        </p>
        <p class="hint" id="linkHint" data-i18n-html="sync.linkHint" hidden style="font-size:11px;color:var(--ink-3);margin:6px 0 0"></p>
      </div>
    </div>

    <div id="paneMerge" hidden>
      <p class="hint" data-i18n-html="sync.mergeHint" style="font-size:12px;color:var(--ink-2);margin:0 0 6px"></p>
      <textarea id="mergeIn" rows="4" placeholder="貼上同步碼…"></textarea>
      <div class="pin">
        <span style="font-size:12px" data-i18n="sync.pinRequired">PIN（如有加密）</span>
        <input type="password" id="mergePin" inputmode="numeric" maxlength="4" placeholder="••••">
      </div>
      <div class="rowbtns">
        <button class="btn primary" id="mergeSync" type="button" data-i18n="sync.merge">合併</button>
      </div>
    </div>

    <p class="syncmsg" id="syncMsg"></p>
  </div>
</div>

<div id="toast" hidden>已儲存</div>

<!-- 【功能】程式本體（由 build.py 內嵌）
     【原因】單檔交付，唔可以有外部 JS 檔案
     【修改指引】改 frontend/js/ 再跑 build.py -->
<script>
/* ===== js/00-core.js ===== */
/* ==========================================================================
   00-core.js — 設定、儲存、日期工具
   【功能】集中管理資料格式、localStorage 讀寫、日期換算
   【原因】全部功能（預測、同步、日曆）都要用同一套日期同資料格式
   【修改指引】改 schema 要同時改 docs/api_spec.json
   ========================================================================== */

// 【功能】儲存鍵名
// 【原因】CEO 指定 key 必須係 period_tracker_data
// 【修改指引】唔需要改
var STORE_KEY = 'period_tracker_data';

// 【功能】預設設定
// 【原因】歷史紀錄不足時做後備
// 【修改指引】想改預設值改呢度
var DEFAULT_SETTINGS = { cycleGap: 28, periodLength: 5 };

// 【功能】全 App 狀態
// 【原因】統一放一齊，重畫時唔會周圍傳參數
// 【修改指引】唔需要改
var App = {
  data: null,
  viewYear: 0,
  viewMonth: 0,      // 0 = 一月
  selected: null,    // 目前彈窗嘅日期 'YYYY-MM-DD'
  syncPayload: null  // 目前產生嘅同步碼
};

/* 【功能】補零
   【原因】日期格式要固定兩位
   【修改指引】唔需要改 */
function pad2(n) {
  return (n < 10 ? '0' : '') + n;
}

/* 【功能】Date → 'YYYY-MM-DD'
   【原因】所有紀錄都用本地日期做 key
   【修改指引】唔需要改 */
function ymd(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

/* 【功能】'YYYY-MM-DD' → Date（本地時間零時）
   【原因】避免用 UTC 解析造成時區偏移
   【修改指引】唔需要改 */
function parseYmd(s) {
  var p = String(s).split('-');
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 0, 0, 0, 0);
}

/* 【功能】加減日數
   【原因】預測要由某日推算之後幾日
   【修改指引】唔需要改 */
function addDays(d, n) {
  var x = new Date(d.getTime());
  x.setDate(x.getDate() + n);
  x.setHours(0, 0, 0, 0);
  return x;
}

/* 【功能】統一轉成 Date
   【原因】呼叫時有時傳 'YYYY-MM-DD' 字串、有時傳 Date，避免再犯同類錯誤
   【修改指引】唔需要改 */
function toDate(x) {
  if (x instanceof Date) return x;
  if (typeof x === 'string') return parseYmd(x);
  return new Date(x);
}

/* 【功能】兩個日期相差幾多日
   【原因】計算週期間隔
   【修改指引】接受 Date 或 'YYYY-MM-DD' 字串
   【注意】回傳 b - a（正數代表 b 較後） */
function dayDiff(a, b) {
  var da = toDate(a), db = toDate(b);
  return Math.round((db.getTime() - da.getTime()) / 86400000);
}

/* 【功能】今日（本地零時）
   【原因】判斷「未來日期」用
   【修改指引】唔需要改 */
function todayDate() {
  var d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

/* 【功能】讀取本機資料
   【原因】開 App 第一件事就要有資料，冇就建空白
   【修改指引】唔需要改 */
function loadData() {
  var raw = null;
  try {
    raw = window.localStorage.getItem(STORE_KEY);
  } catch (e) {
    raw = null;
  }
  var data = null;
  if (raw) {
    try { data = JSON.parse(raw); } catch (e2) { data = null; }
  }
  if (!data || typeof data !== 'object') data = {};
  if (!data.settings) data.settings = { cycleGap: DEFAULT_SETTINGS.cycleGap, periodLength: DEFAULT_SETTINGS.periodLength };
  if (!data.logs) data.logs = {};
  // 【原因】舊資料可能冇呢兩個欄位，要補返
  if (!data.settings.cycleGap) data.settings.cycleGap = DEFAULT_SETTINGS.cycleGap;
  if (!data.settings.periodLength) data.settings.periodLength = DEFAULT_SETTINGS.periodLength;

  // 【功能】第一次開：跟瀏覽器語言
  // 【原因】英文用家唔想一開就係中文；中文（台灣／繁體）用家就用書面語
  // 【修改指引】唔需要改
  if (!data.settings.lang) {
    var nav = String(navigator.language || 'zh-TW');
    // 【原因】只有兩種語言：英文瀏覽器用 en，其餘一律繁體中文（書面語）
    if (/^en/i.test(nav)) data.settings.lang = 'en';
    else data.settings.lang = 'zh-TW';
  }
  return data;
}

/* 【功能】寫入本機資料
   【原因】每次改動即刻存，唔靠「離開前才存」
   【修改指引】唔需要改 */
function saveData() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(App.data));
    return true;
  } catch (e) {
    return false;
  }
}

/* 【功能】取某日紀錄（冇就回傳 null）
   【原因】日曆同彈窗都要讀
   【修改指引】唔需要改 */
function getLog(dateKey) {
  return App.data.logs[dateKey] || null;
}

/* 【功能】寫入／更新某日紀錄
   【原因】要自動加時間戳，同步時用嚟判斷邊邊較新
   【修改指引】唔需要改 */
function setLog(dateKey, log) {
  if (!log) {
    delete App.data.logs[dateKey];
  } else {
    log.updatedAt = Date.now();
    App.data.logs[dateKey] = log;
  }
  saveData();
}

/* 【功能】判斷一日係唔係「有紀錄但空白」
   【原因】避免存一堆冇意義嘅空紀錄
   【修改指引】唔需要改 */
function isEmptyLog(log) {
  if (!log) return true;
  return !log.isPeriod && !log.safeSex && !log.unsafeSex && !(log.remark && String(log.remark).trim());
}

/* 【功能】HTML 轉義
   【原因】備註係用戶自由輸入，唔可以直接塞入 innerHTML
   【修改指引】唔需要改 */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ===== js/10-predict.js ===== */
/* ==========================================================================
   10-predict.js — 動態預測引擎
   【功能】由歷史紀錄推算平均週期同平均經期長度，再標出未來預測經期日
   【原因】CEO 明確要求：唔可以寫死 28 日，要按歷史計，近期權重較高；
           紀錄不足（少過 2 個完整週期）才用設定嘅預設值
   【修改指引】要改權重改 WEIGHTS；要改容許合併同日數改 EVENT_GAP_DAYS
   ========================================================================== */

// 【功能】連續月經日之間最多相隔幾多日仍然當同一次經期
// 【原因】有人會有「一天停一停」的情況；相差 1 日仍然算同一事件，避免把一次經期拆兩次
// 【修改指引】想嚴格「一定要連續」就設 0
var EVENT_GAP_DAYS = 1;

// 【功能】近期週期權重（最近一個最重）
// 【原因】CEO 要求「近期權重較高」，用 3:2:1
// 【修改指引】可以改成 [4,3,2,1] 等
var WEIGHTS = [3, 2, 1];

/* 【功能】把有月經嘅日子歸類成「經期事件」
   【原因】預測要用「一次經期」做單位（開始日、長度），唔係逐日計
   【修改指引】唔需要改 */
function buildPeriodEvents(logs) {
  var days = [];
  for (var k in logs) {
    if (!Object.prototype.hasOwnProperty.call(logs, k)) continue;
    if (logs[k] && logs[k].isPeriod) days.push(k);
  }
  days.sort();

  var events = [];
  var cur = null;
  for (var i = 0; i < days.length; i++) {
    var d = parseYmd(days[i]);
    if (!cur) {
      cur = { start: days[i], end: days[i], days: 1 };
      continue;
    }
    var gap = dayDiff(cur.end, d);
    if (gap <= EVENT_GAP_DAYS + 0 && gap >= 1) {
      // 接住上一個事件
      cur.end = days[i];
      cur.days = dayDiff(cur.start, cur.end) + 1;
    } else if (gap === 0) {
      // 同一日（正常唔會發生），跳過
    } else {
      events.push(cur);
      cur = { start: days[i], end: days[i], days: 1 };
    }
  }
  if (cur) events.push(cur);
  return events;
}

/* 【功能】加權平均
   【原因】近期週期比舊嘅更能反映現況
   【修改指引】valueList 必須係「由舊到新」
   【回傳】加權平均（如果冇資料回傳 0） */
function weightedAverage(valueList) {
  if (!valueList.length) return 0;
  var total = 0, wsum = 0;
  for (var i = 0; i < valueList.length; i++) {
    // 【原因】最後一個（最新）權重最大
    var fromEnd = valueList.length - 1 - i;
    var w = WEIGHTS[fromEnd] || 1;
    total += valueList[i] * w;
    wsum += w;
  }
  return wsum ? total / wsum : 0;
}

/* 【功能】計出目前用嚟預測嘅參數
   【原因】要知係「用歷史」定「用預設」，同時要顯示俾用戶睇
   【修改指引】唔需要改
   【回傳】{ cycleGap, periodLength, source, cycles, events } */
function computePredictionParams(logs, settings) {
  var events = buildPeriodEvents(logs);

  // 週期間隔：每次經期「開始日」之間嘅距離
  var gaps = [];
  for (var i = 1; i < events.length; i++) {
    gaps.push(dayDiff(events[i - 1].start, events[i].start));
  }
  // 明顯離譜嘅間隔（少過 15 日或者多過 90 日）唔計，避免手誤拉歪預測
  gaps = gaps.filter(function (g) { return g >= 15 && g <= 90; });

  var lengths = events.map(function (e) { return e.days; })
    .filter(function (n) { return n >= 1 && n <= 15; });

  var fallback = {
    cycleGap: settings.cycleGap || DEFAULT_SETTINGS.cycleGap,
    periodLength: settings.periodLength || DEFAULT_SETTINGS.periodLength,
    source: 'default',
    cycles: gaps.length,
    events: events
  };

  // 【功能】歷史不足 2 個完整週期就全部用預設
  // 【原因】CEO 規格明確要求
  // 【修改指引】唔需要改
  if (gaps.length < 2) return fallback;

  var cg = Math.round(weightedAverage(gaps));
  var plRaw = lengths.length ? weightedAverage(lengths) : fallback.periodLength;
  var pl = Math.max(1, Math.round(plRaw));

  // 【原因】極端情況保護：避免週期短過經期
  if (cg <= pl) cg = pl + 1;

  return { cycleGap: cg, periodLength: pl, source: 'history', cycles: gaps.length, events: events };
}

/* 【功能】產生未來預測經期日
   【原因】日曆要顯示淡紅色血滴
   【修改指引】predictMonths 控制往後預測幾多個月
   【回傳】{ 'YYYY-MM-DD': true } 嘅物件 */
function predictPeriodDays(logs, settings, opts) {
  var params = computePredictionParams(logs, settings);
  var months = (opts && opts.months) || 12;
  var out = {};
  if (!params.events.length) return { map: out, params: params };

  var last = params.events[params.events.length - 1];
  var lastEnd = parseYmd(last.end);
  var today = todayDate();
  var limit = addDays(today, Math.round(months * 30.4));

  var cursor = parseYmd(last.start);
  var guard = 0;
  while (guard++ < 200) {
    cursor = addDays(cursor, params.cycleGap);
    if (cursor > limit) break;
    for (var i = 0; i < params.periodLength; i++) {
      var d = addDays(cursor, i);
      var key = ymd(d);
      // 【功能】只標未來、未記錄嘅日子
      // 【原因】過去唔應該再顯示「預測」；已記錄嘅用實心血滴
      if (d < today) continue;
      if (d <= lastEnd) continue;
      if (logs[key] && logs[key].isPeriod) continue;
      out[key] = true;
    }
  }
  return { map: out, params: params };
}


/* 【功能】估算易孕期（藍框）、相對低機會日（綠框）同排卵日（圓點）
   【原因】CEO 要求用科學方法由經期紀錄動態推算
   【原理】
     - 受孕只可能發生喺「排卵日前 5 日至排卵日」呢 6 日（NEJM 1995 Wilcox 研究）
     - 排卵日 ≈ 下一次預計經期開始日 − 14 日（黃體期相對穩定）
     - 綠色只框「經期前後一段」：經期結束後 3 日、下次經期前 3 日
   【限制】日曆法唔可以當避孕（典型使用失敗率 14–27%，Guttmacher）
   【修改指引】想調窗口長度改 FERTILE_BEFORE / SAFE_AFTER_PERIOD / SAFE_BEFORE_PERIOD
   */
var FERTILE_BEFORE = 5;        // 排卵日前幾多日開始易孕
var SAFE_AFTER_PERIOD = 3;     // 經期結束後幾多日算「相對低機會」
var SAFE_BEFORE_PERIOD = 3;    // 下次經期前幾多日算「相對低機會」
var LUTEAL_DAYS = 14;          // 排卵到下次經期嘅日數

function computeFertility(logs, settings, opts) {
  var months = (opts && opts.months) || 12;
  var p = computePredictionParams(logs, settings);
  var out = { ok: false, fertile: {}, safe: {}, ovulation: {}, params: p };

  // 【原因】紀錄不足 2 個完整週期就唔亂估，免得誤導
  if (!p.events.length || p.source !== 'history') return out;

  out.ok = true;
  var today = todayDate();
  var limit = addDays(today, Math.round(months * 30.4));
  // 【功能】由「上一個月一號」開始標
  // 【原因】只標今日之後嘅話，今個月會空白一片，睇唔到剛過去嘅週期
  // 【修改指引】唔需要改
  var floor = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  var last = p.events[p.events.length - 1];
  var lastStart = parseYmd(last.start);

  function mark(map, d) {
    if (d < floor || d > limit) return;
    map[ymd(d)] = true;
  }

  for (var n = 0; n < 24; n++) {
    var start = addDays(lastStart, p.cycleGap * n);
    if (start > limit) break;
    var end = addDays(start, p.periodLength - 1);
    var nextStart = addDays(start, p.cycleGap);
    var ovu = addDays(nextStart, -LUTEAL_DAYS);

    // 藍：易孕期（排卵前 5 日至排卵日）
    for (var i = FERTILE_BEFORE; i >= 0; i--) mark(out.fertile, addDays(ovu, -i));
    mark(out.ovulation, ovu);

    // 綠：經期結束後一段
    for (var a = 1; a <= SAFE_AFTER_PERIOD; a++) {
      var d1 = addDays(end, a);
      if (!out.fertile[ymd(d1)]) mark(out.safe, d1);
    }
    // 綠：下次經期前一段
    for (var b = SAFE_BEFORE_PERIOD; b >= 1; b--) {
      var d2 = addDays(nextStart, -b);
      if (!out.fertile[ymd(d2)]) mark(out.safe, d2);
    }
  }
  return out;
}


/* ===== js/20-sync.js ===== */
/* ==========================================================================
   20-sync.js — 伴侶同步（無伺服器）、備份匯出／匯入
   【功能】把本機資料壓縮（可選加密）成一串「同步碼」，對方貼上就合併
   【原因】CEO 要求：唔准用雲端、唔准註冊；用可分享字串做 P2P 同步
           （QR 已按 CEO 指示移除）
   【修改指引】格式版本喺 FORMAT_TAG，改格式要同時改 decodeSync 嘅判斷
   ========================================================================== */

// 【功能】同步碼格式標記
// 【原因】日後改格式可以分辨新舊
// 【修改指引】唔需要改
var FORMAT_TAG = 'PT1';
var FORMAT_TAG_ENC = 'PT1E';

/* 【功能】Uint8Array → base64url
   【原因】放入網址／訊息唔可以有 +／ 等字元
   【修改指引】唔需要改 */
function bytesToB64url(u8) {
  var s = '';
  for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* 【功能】base64url → Uint8Array
   【原因】解碼同步碼
   【修改指引】唔需要改 */
function b64urlToBytes(str) {
  var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  var bin = atob(s);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

/* 【功能】壓縮位元組（deflate）
   【原因】同步碼要越短越好，方便用訊息傳
   【修改指引】唔需要改 */
async function deflateBytes(u8) {
  var cs = new CompressionStream('deflate');
  var stream = new Blob([u8]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* 【功能】解壓
   【原因】對方貼上嘅同步碼要還原
   【修改指引】唔需要改 */
async function inflateBytes(u8) {
  var ds = new DecompressionStream('deflate');
  var stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* 【功能】由 4 位 PIN 派生加密金鑰
   【原因】同步碼含私密紀錄，用 PIN 加密可以安全啲喺訊息傳
   【修改指引】iterations 越高越安全但越慢
   【回傳】CryptoKey（AES-GCM 256） */
async function deriveKey(pin, salt) {
  var enc = new TextEncoder();
  var baseKey = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 150000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

/* 【功能】產生同步碼
   【原因】俾用戶複製去傳畀伴侶
   【修改指引】唔需要改
   【回傳】字串 */
async function encodeSync(pin) {
  var payload = { settings: App.data.settings, logs: App.data.logs };
  var json = new TextEncoder().encode(JSON.stringify(payload));
  var packed = await deflateBytes(json);

  if (pin) {
    // 【功能】加密版：salt + iv + 密文
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var key = await deriveKey(pin, salt);
    var cipher = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, packed));
    return FORMAT_TAG_ENC + '.' + bytesToB64url(salt) + '.' + bytesToB64url(iv) + '.' + bytesToB64url(cipher);
  }
  return FORMAT_TAG + '.' + bytesToB64url(packed);
}

/* 【功能】解讀同步碼
   【原因】要知有冇加密，再決定要唔要問 PIN
   【修改指引】唔需要改 */
function extractSyncCode(input) {
  // 【功能】由任何輸入拆出同步碼
  // 【原因】用戶好可能貼成條網址（…/index.html#sync=PT1E…），唔會自己剪走前面
  // 【修改指引】唔需要改
  var t = String(input || '').trim();
  var i = t.indexOf('#sync=');
  if (i >= 0) return decodeURIComponent(t.slice(i + 6));
  i = t.indexOf('?sync=');
  if (i >= 0) return decodeURIComponent(t.slice(i + 6).split('&')[0]);
  return t;
}

function inspectSync(code) {
  var t = extractSyncCode(code);
  if (t.indexOf(FORMAT_TAG_ENC + '.') === 0) return { ok: true, encrypted: true };
  if (t.indexOf(FORMAT_TAG + '.') === 0) return { ok: true, encrypted: false };
  return { ok: false, encrypted: false, error: '同步碼格式唔對，請確認有冇複製完整。' };
}

/* 【功能】解碼同步碼
   【原因】合併前要先還原成資料
   【修改指引】唔需要改 */
async function decodeSync(code, pin) {
  var t = extractSyncCode(code);
  var info = inspectSync(t);
  if (!info.ok) throw new Error(info.error);

  var parts = t.split('.');
  var packed;
  if (info.encrypted) {
    if (!pin) throw new Error('呢個同步碼有加密，請輸入 4 位 PIN。');
    var salt = b64urlToBytes(parts[1]);
    var iv = b64urlToBytes(parts[2]);
    var cipher = b64urlToBytes(parts[3]);
    var key = await deriveKey(pin, salt);
    try {
      packed = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, cipher));
    } catch (e) {
      throw new Error('PIN 唔啱，或者同步碼損壞。');
    }
  } else {
    packed = b64urlToBytes(parts[1]);
  }

  var json;
  try {
    json = new TextDecoder().decode(await inflateBytes(packed));
  } catch (e2) {
    throw new Error('同步碼解壓失敗，可能複製唔完整。');
  }
  var data = JSON.parse(json);
  if (!data || typeof data !== 'object' || !data.logs) throw new Error('同步碼內容唔完整。');
  return data;
}

/* 【功能】合併兩邊紀錄
   【原因】CEO 要求：唔可以覆蓋未衝突嘅日期；同一日就用「最後修改時間較新」嗰個
   【修改指引】唔需要改
   【回傳】{ added, updated, kept, skipped } */
function mergeLogs(incoming) {
  var result = { added: 0, updated: 0, kept: 0, skipped: 0 };
  if (!incoming || !incoming.logs) return result;

  for (var k in incoming.logs) {
    if (!Object.prototype.hasOwnProperty.call(incoming.logs, k)) continue;
    // 【原因】只接受合法日期 key，避免壞資料污染
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) { result.skipped++; continue; }
    var inc = incoming.logs[k];
    var mine = App.data.logs[k];
    if (!mine) {
      App.data.logs[k] = inc;
      result.added++;
      continue;
    }
    var tInc = Number(inc.updatedAt || 0);
    var tMine = Number(mine.updatedAt || 0);
    if (tInc > tMine) {
      App.data.logs[k] = inc;
      result.updated++;
    } else {
      result.kept++;
    }
  }
  return result;
}

/* 【功能】匯出備份（JSON 檔案）
   【原因】浏覽器資料有機會被清走，要可以自己備份
   【修改指引】唔需要改 */
function exportBackup() {
  var payload = JSON.stringify({ app: 'period-tracker', exportedAt: new Date().toISOString(), data: App.data }, null, 2);
  var blob = new Blob([payload], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'period-tracker-backup-' + ymd(todayDate()) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* 【功能】匯入備份
   【原因】換機／瀏覽器清資料後可以還原
   【修改指引】匯入一樣走合併規則，唔會蓋走較新嘅紀錄 */
async function importBackupText(text) {
  var obj = JSON.parse(text);
  var data = obj && obj.data ? obj.data : obj;
  if (!data || !data.logs) throw new Error('呢個檔案唔似係本程式嘅備份。');
  if (data.settings && data.settings.cycleGap) {
    App.data.settings.cycleGap = data.settings.cycleGap;
  }
  if (data.settings && data.settings.periodLength) {
    App.data.settings.periodLength = data.settings.periodLength;
  }
  var r = mergeLogs(data);
  saveData();
  return r;
}

/* 【功能】畫月曆格
   【原因】主畫面
   【修改指引】唔需要改 */
function renderCalendar() {
  var y = App.viewYear, m = App.viewMonth;
  $('monthLabel').textContent = monthTitle(y, m);

  var pred = predictPeriodDays(App.data.logs, App.data.settings, { months: 14 });
  App.predMap = pred.map;
  App.params = pred.params;

  // 【功能】易孕期／低機會／排卵日（可以喺設定關閉）
  // 【原因】用科學方法估算，藍框／綠框＋紫點顯示
  // 【修改指引】唔需要改
  var showFert = !(App.data.settings && App.data.settings.showFertility === false);
  var fert = showFert
    ? computeFertility(App.data.logs, App.data.settings, { months: 14 })
    : { ok: false, fertile: {}, safe: {}, ovulation: {} };
  App.fert = fert;

  var todayKey = ymd(todayDate());
  var first = new Date(y, m, 1);
  var startPad = first.getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();

  var html = '';
  for (var i = 0; i < startPad; i++) html += '<div class="cell empty"></div>';

  for (var d = 1; d <= daysInMonth; d++) {
    var key = y + '-' + pad2(m + 1) + '-' + pad2(d);
    var log = getLog(key);
    var drop;

    if (log && log.isPeriod) {
      drop = '<span class="drop" title="' + esc(t('legend.period')) + '">🩸</span>';
    } else if (pred.map[key]) {
      drop = '<span class="drop pred" title="' + esc(t('legend.predicted')) + '">🩸</span>';
    } else {
      drop = '<span class="drop" style="visibility:hidden">🩸</span>';
    }

    var badges = '';
    if (log && log.safeSex) badges += '<span title="' + esc(t('mark.safeSex')) + '">🛡️</span>';
    if (log && log.unsafeSex) badges += '<span title="' + esc(t('mark.unsafeSex')) + '">⚠️</span>';
    if (log && log.remark && String(log.remark).trim()) badges += '<span title="' + esc(t('label.note')) + '">💬</span>';

    var cls = 'cell';
    if (key === todayKey) cls += ' today';
    if (log && !isEmptyLog(log)) cls += ' haslog';
    if (fert.ok && fert.fertile[key]) cls += ' fertile';
    else if (fert.ok && fert.safe[key]) cls += ' safe';

    var ovuDot = (fert.ok && fert.ovulation[key])
      ? '<i class="ovu" title="' + esc(t('legend.ovulation')) + '"></i>' : '';

    html += '<button class="' + cls + '" type="button" data-date="' + key + '">' +
      ovuDot +
      '<span class="dnum">' + d + '</span>' + drop +
      '<span class="badges">' + badges + '</span></button>';
  }

  $('grid').innerHTML = html;
  paintSelection();
}

/* 【功能】畫出多日選取嘅高亮
   【原因】用戶要睇清楚掃咗邊幾日
   【修改指引】唔需要改 */
function paintSelection() {
  var cells = document.querySelectorAll('.cell[data-date]');
  if (!Sel.active || !Sel.start || !Sel.end) {
    for (var i = 0; i < cells.length; i++) cells[i].classList.remove('sel');
    return;
  }
  var a = Sel.start < Sel.end ? Sel.start : Sel.end;
  var b = Sel.start < Sel.end ? Sel.end : Sel.start;
  for (var j = 0; j < cells.length; j++) {
    var k = cells[j].getAttribute('data-date');
    cells[j].classList.toggle('sel', k >= a && k <= b);
  }
}

/* 【功能】底部預測文字
   【原因】用戶要知預測依據（歷史平均 vs 設定值）同下次大約幾時
   【修改指引】唔需要改 */
function renderFooter() {
  var el = $('predText');
  var p = App.params || computePredictionParams(App.data.logs, App.data.settings);

  if (!p.events.length) {
    el.innerHTML = t('footer.noRecords');
    var n0 = $('fertilityNote');
    if (n0) n0.hidden = true;
    return;
  }

  // 【功能】由最後一次經期開始日往後推，直到第一個「今日或之後」嘅預計開始日
  // 【原因】漏記時直接加一次週期會得出過去日期，顯示「已過 N 日」好誤導
  // 【修改指引】唔需要改
  var last = p.events[p.events.length - 1];
  var today = todayDate();
  var next = addDays(parseYmd(last.start), p.cycleGap);
  var guard = 0;
  while (next < today && guard++ < 60) next = addDays(next, p.cycleGap);
  var diff = dayDiff(today, next);

  var src = p.source === 'history'
    ? t('footer.srcHistory', { n: p.cycles, g: p.cycleGap, p: p.periodLength })
    : t('footer.srcDefault', { g: p.cycleGap });

  var head = diff === 0
    ? t('footer.today')
    : t('footer.nextIn', { d: diff, date: shortDate(next) });

  el.innerHTML = head + '<span class="sub">' + esc(src) + '</span>';

  // 【功能】有推算結果才顯示免責聲明
  // 【原因】避免用戶誤當成避孕工具
  // 【修改指引】唔需要改
  var showFert = !(App.data.settings && App.data.settings.showFertility === false);
  var note = $('fertilityNote');
  if (note) note.hidden = !(showFert && App.fert && App.fert.ok);
}

/* 【功能】開每日記錄彈窗（支援多日）
   【原因】撳日期就開；撳住掃過幾日就一次過標記
   【修改指引】唔需要改 */
function openDayModal(dateKey, rangeEnd) {
  App.selected = dateKey;
  App.rangeEnd = rangeEnd || null;

  var isRange = !!(rangeEnd && rangeEnd !== dateKey);
  var a = isRange && rangeEnd < dateKey ? rangeEnd : dateKey;
  var b = isRange && rangeEnd < dateKey ? dateKey : rangeEnd;
  var n = isRange ? (dayDiff(a, b) + 1) : 1;

  if (isRange) {
    $('dayTitle').textContent = rangeTitle(a, b, n);
    $('modalSub').textContent = t('modal.subRange', { n: n });
  } else {
    $('dayTitle').textContent = dateTitle(parseYmd(a));
    $('modalSub').textContent = t('modal.sub');
  }

  // 多日模式隱藏安全／不安全／備註（每日可能唔同，唔應該一次過蓋）
  $('rowSafe').hidden = isRange;
  $('rowUnsafe').hidden = isRange;
  $('remark').hidden = isRange;
  $('remarkLabel').hidden = isRange;

  var log = getLog(a) || {};
  $('cbPeriod').checked = isRange ? true : !!log.isPeriod;
  $('cbSafe').checked = isRange ? false : !!log.safeSex;
  $('cbUnsafe').checked = isRange ? false : !!log.unsafeSex;
  $('remark').value = isRange ? '' : (log.remark || '');

  var flow = log.flow || 'normal';
  document.querySelectorAll('.fbtn').forEach(function (btn) {
    btn.setAttribute('aria-pressed', btn.getAttribute('data-flow') === flow ? 'true' : 'false');
  });

  syncChecks();
  $('dayModal').hidden = false;
}

   【原因】兩個同時勾係矛盾資料
   【修改指引】唔需要改 */
function enforceSexclusive(which) {
  if (which === 'safe' && $('cbSafe').checked) $('cbUnsafe').checked = false;
  if (which === 'unsafe' && $('cbUnsafe').checked) $('cbSafe').checked = false;
  syncChecks();

/* 【功能】儲存紀錄（支援多日）
   【原因】寫入 localStorage，即刻重算預測並刷新日曆
   【修改指引】唔需要改 */
function saveDayModal() {
  var key = App.selected;
  if (!key) return;

  var isPeriod = $('cbPeriod').checked;
  var flowBtn = document.querySelector('.fbtn[aria-pressed="true"]');
  var flow = isPeriod ? (flowBtn ? flowBtn.getAttribute('data-flow') : 'normal') : null;

  if (App.rangeEnd && App.rangeEnd !== key) {
    // 【功能】多日：逐日寫入月經同流量，其他欄位保留原本
    // 【原因】補記經期係最常見操作，唔應該蓋走當日嘅備註／性行為紀錄
    // 【修改指引】唔需要改
    var a = App.rangeEnd < key ? App.rangeEnd : key;
    var b = App.rangeEnd < key ? key : App.rangeEnd;
    var cursor = parseYmd(a);
    var end = parseYmd(b);
    var count = 0;
    while (cursor <= end) {
      var k = ymd(cursor);
      var old = getLog(k) || {};
      if (isPeriod) {
        setLog(k, {
          isPeriod: true, flow: flow,
          safeSex: !!old.safeSex, unsafeSex: !!old.unsafeSex, remark: old.remark || ''
        });
      } else if (old.isPeriod) {
        var keep = {
          isPeriod: false, flow: null,
          safeSex: !!old.safeSex, unsafeSex: !!old.unsafeSex, remark: old.remark || ''
        };
        if (isEmptyLog(keep)) setLog(k, null); else setLog(k, keep);
      }
      count++;
      cursor = addDays(cursor, 1);
    }
    closeDayModal();
    renderAll();
    toast(t('toast.marked', { n: count }));
    return;
  }

  var log = {
    isPeriod: isPeriod,
    flow: flow,
    safeSex: $('cbSafe').checked,
    unsafeSex: $('cbUnsafe').checked,
    remark: $('remark').value.trim()
  };

  var empty = isEmptyLog(log);
  if (empty) setLog(key, null);
  else setLog(key, log);

  closeDayModal();
  renderAll();
  toast(empty ? t('toast.cleared') : t('toast.saved'));
}

/* 【功能】刪除紀錄（多日一樣）
   【原因】需要可以整段刪走
   【修改指引】唔需要改 */
function clearDayModal() {
  var key = App.selected;
  if (!key) return;

  if (App.rangeEnd && App.rangeEnd !== key) {
    var a = App.rangeEnd < key ? App.rangeEnd : key;
    var b = App.rangeEnd < key ? key : App.rangeEnd;
    var cursor = parseYmd(a), end = parseYmd(b);
    while (cursor <= end) { setLog(ymd(cursor), null); cursor = addDays(cursor, 1); }
  } else {
    setLog(key, null);
  }

  closeDayModal();
  renderAll();
  toast(t('toast.deleted'));
}

   【修改指引】唔需要改 */
function cycleTheme() {
  var th = (App.data.settings && App.data.settings.theme) || 'auto';
  var next = th === 'auto' ? 'dark' : (th === 'dark' ? 'light' : 'auto');
  App.data.settings.theme = next;
  saveData();
  applyTheme();
  toast(next === 'auto' ? t('toast.themeAuto') : (next === 'dark' ? t('toast.themeDark') : t('toast.themeLight')));
}

/* 【功能】產生同步碼
   【原因】俾用戶傳畀另一半
   【修改指引】唔需要改 */
async function doGenerateSync() {
  var pin = $('genPin').value.trim();
  if (pin && !/^\d{4}$/.test(pin)) { setSyncMsg(t('toast.pin4'), true); return; }
  setSyncMsg(t('sync.msgGenerating'), false);
  try {
    var code = await encodeSync(pin || null);
    $('syncOut').value = code;
    $('syncOutWrap').hidden = false;
    var days = Object.keys(App.data.logs).length;
    setSyncMsg(t('sync.msgGenerated', {
      d: days, n: code.length,
      enc: pin ? t('sync.msgEncrypted') : t('sync.msgPlain')
    }), false);
    var isFile = location.protocol === 'file:';
    $('linkHint').hidden = isFile;
    $('copyLink').disabled = isFile;
  } catch (e) {
    setSyncMsg(t('sync.msgGenFailed', { e: e.message }), true);
  }
}

/* 【功能】複製同步碼
   【原因】方便貼去訊息
   【修改指引】唔需要改 */
async function copySync() {
  var v = $('syncOut').value;
  if (!v) { setSyncMsg(t('toast.needCode'), true); return; }
  try {
    await navigator.clipboard.writeText(v);
    setSyncMsg(t('toast.copied'), false);
  } catch (e) {
    $('syncOut').select();
    setSyncMsg(t('toast.selected'), false);
  }
}

/* 【功能】用手機／電腦內建分享傳同步碼
   【原因】AirDrop／WhatsApp 比複製貼上快
   【修改指引】唔支援分享會自動退回複製
   */
async function shareSync() {
  var v = $('syncOut').value;
  if (!v) { setSyncMsg(t('toast.needCode'), true); return; }
  if (navigator.share) {
    try {
      await navigator.share({ title: t('app.title'), text: v });
      setSyncMsg(t('toast.shared'), false);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') { setSyncMsg(t('toast.shareCancelled'), false); return; }
    }
  }
  await copySync();
  setSyncMsg(t('toast.shareUnsupported'), false);
}

/* 【功能】複製帶同步碼嘅連結
   【原因】一個連結就傳得
   【注意】本機 file:// 開出嚟嘅連結對別人冇意義，會禁用
   【修改指引】唔需要改
   */
async function copySyncLink() {
  var v = $('syncOut').value;
  if (!v) { setSyncMsg(t('toast.needCode'), true); return; }
  if (location.protocol === 'file:') { setSyncMsg(t('toast.localNoLink'), true); return; }
  var url = location.origin + location.pathname + '#sync=' + encodeURIComponent(v);
  try {
    await navigator.clipboard.writeText(url);
    setSyncMsg(t('toast.linkCopiedPaste', { n: url.length }), false);
  } catch (e) {
    setSyncMsg(t('toast.copyFailed'), true);
  }
}

/* 【功能】合併對方資料
   【原因】解碼 → 合併（唔覆蓋衝突日期）→ 重算 → 刷新
   【修改指引】唔需要改 */
async function doMergeSync() {
  var code = $('mergeIn').value.trim();
  var pin = $('mergePin').value.trim();
  if (!code) { setSyncMsg(t('sync.msgNeedCode'), true); return; }
  var info = inspectSync(code);
  if (!info.ok) { setSyncMsg(info.error, true); return; }
  if (info.encrypted && !pin) { setSyncMsg(t('sync.msgNeedPin'), true); return; }

  setSyncMsg(t('sync.msgDecoding'), false);
  try {
    var incoming = await decodeSync(code, pin || null);
    var r = mergeLogs(incoming);
    saveData();
    renderAll();
    setSyncMsg(t('sync.msgMerged', { a: r.added, u: r.updated, k: r.kept }), false);
    $('mergeIn').value = '';
  } catch (e) {
    setSyncMsg(t('sync.msgMergeFailed', { e: e.message }), true);
  }
}

/* 【功能】顯示同步訊息
   【原因】要知成功／失敗原因
   【修改指引】唔需要改 */
function setSyncMsg(msg, isError) {
  var el = $('syncMsg');
  el.textContent = msg;
  el.className = 'syncmsg' + (isError ? ' err' : '');
}

/* 【功能】底部短提示
   【原因】操作要有即時回饋
   【修改指引】唔需要改 */
var toastTimer = null;
function toast(msg) {
  var el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 1800);
}

/* 【功能】換月
   【原因】頂欄 ‹ ›
   【修改指引】唔需要改 */
function moveMonth(delta) {
  var m = App.viewMonth + delta;
  var y = App.viewYear;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  App.viewMonth = m;
  App.viewYear = y;
  renderCalendar();
}

/* 【功能】跳去今個月
   【原因】快速返回
   【修改指引】唔需要改 */
function jumpToday() {
  var n = new Date();
  App.viewYear = n.getFullYear();
  App.viewMonth = n.getMonth();
  renderCalendar();
}

/* 【功能】由網址讀同步碼
   【原因】規格有 #sync=...；放上網之後可以用連結傳
   【修改指引】唔需要改 */
function consumeUrlSync() {
  var h = location.hash || '';
  if (h.indexOf('#sync=') !== 0) return;
  try {
    var code = decodeURIComponent(h.slice(6));
    $('mergeIn').value = code;
    $('syncModal').hidden = false;
    switchSyncTab('merge');
    setSyncMsg(t('sync.msgFromUrl'), false);
    history.replaceState(null, '', location.pathname);
  } catch (e) { /* 忽略壞網址 */ }
}

/* 【功能】切換同步分頁
   【原因】產生同合併分開，畫面簡潔
   【修改指引】唔需要改 */
function switchSyncTab(which) {
  var gen = which === 'gen';
  $('paneGen').hidden = !gen;
  $('paneMerge').hidden = gen;
  $('tabGen').classList.toggle('on', gen);
  $('tabMerge').classList.toggle('on', !gen);
  setSyncMsg('', false);
}

/* 【功能】匯出備份（可加密）
   【原因】備份；加密版可安全擺喺雲端／傳送
   【修改指引】唔需要改 */
async function doExportBackup() {
  var pin = $('backupPin').value.trim();
  if (pin && !/^\d{4}$/.test(pin)) { toast(t('toast.pin4')); return; }
  try {
    if (pin) {
      var code = await encodeSync(pin);
      downloadBlob(new Blob([code], { type: 'text/plain' }), 'period-backup-' + ymd(todayDate()) + '.ptbackup');
      toast(t('toast.exportedEnc'));
    } else {
      exportBackup();
      toast(t('toast.exported'));
    }
  } catch (e) {
    toast(t('toast.exported') + ' ✕');
  }
}

/* 【功能】匯入備份（支援 .json 同加密 .ptbackup）
   【原因】換機／資料被清之後還原
   【修改指引】加密檔要用同一個 PIN
   */
async function onImportFile(files) {
  if (!files || !files.length) return;
  try {
    var text = await files[0].text();
    var r;
    if (inspectSync(text).ok) {
      var pin = $('backupPin').value.trim();
      if (!pin) { toast(t('toast.needPin')); return; }
      var data = await decodeSync(text, pin);
      r = mergeLogs(data);
      if (data.settings && data.settings.cycleGap) App.data.settings.cycleGap = data.settings.cycleGap;
      if (data.settings && data.settings.periodLength) App.data.settings.periodLength = data.settings.periodLength;
      saveData();
    } else {
      r = await importBackupText(text);
    }
    renderAll();
    toast(t('toast.imported', { a: r.added, u: r.updated }));
  } catch (e) {
    toast(t('toast.importFailed', { e: e.message }) || ('✕ ' + e.message));
  }
  $('importFile').value = '';
}

/* 【功能】觸發下載
   【原因】匯出備份要用
   【修改指引】唔需要改 */
function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* 【功能】清除同呢個程式相關嘅瀏覽器紀錄
   【原因】CEO 要求可以一鍵清走本機資料
   【注意】破壞性操作：必須二次確認
   【修改指引】如有新增其他 localStorage key，要一併清
   */
function clearLocalRecords() {
  var n = Object.keys(App.data.logs).length;
  if (!window.confirm(t('confirm.clear1', { n: n }))) return;
  if (!window.confirm(t('confirm.clear2'))) return;

  try {
    window.localStorage.removeItem('period_tracker_data');
    window.sessionStorage.clear();
  } catch (e) { /* 忽略 */ }

  App.data = {
    settings: {
      cycleGap: DEFAULT_SETTINGS.cycleGap,
      periodLength: DEFAULT_SETTINGS.periodLength,
      theme: 'auto',
      lang: currentLang()
    },
    logs: {}
  };
  saveData();
  applyTheme();
  renderAll();
  $('drawer').classList.remove('open');
  toast(t('toast.clearedAll'));
}

/* 【功能】填語言選單
   【原因】語言清單集中喺 05-i18n.js
   【修改指引】唔需要改 */
function buildLangSelect() {
  var sel = $('langSel');
  if (!sel) return;
  sel.innerHTML = LOCALES.map(function (l) {
    return '<option value="' + l.id + '">' + esc(l.label) + '</option>';
  }).join('');
  sel.value = currentLang();
}

/* 【功能】綁定所有事件
   【原因】集中初始化
   【修改指引】唔需要改 */
function initApp() {
  App.data = loadData();
  var now = new Date();
  App.viewYear = now.getFullYear();
  App.viewMonth = now.getMonth();

  buildLangSelect();
  applyStaticText();
  applyTheme();

  $('prevBtn').addEventListener('click', function () { moveMonth(-1); });
  $('nextBtn').addEventListener('click', function () { moveMonth(1); });
  $('todayBtn').addEventListener('click', jumpToday);

  // 【功能】日曆互動：撳一下開單日；撳住掃過幾日開多日模式
  // 【原因】連續補記經期最快
  // 【修改指引】唔需要改
  var grid = $('grid');
  grid.addEventListener('pointerdown', function (ev) {
    var cell = ev.target.closest('.cell[data-date]');
    if (!cell) return;
    Sel.active = true;
    Sel.start = cell.getAttribute('data-date');
    Sel.end = Sel.start;
    paintSelection();
  });
  grid.addEventListener('pointerover', function (ev) {
    if (!Sel.active) return;
    var cell = ev.target.closest('.cell[data-date]');
    if (!cell) return;
    Sel.end = cell.getAttribute('data-date');
    paintSelection();
  });
  window.addEventListener('pointerup', function () {
    if (!Sel.active) return;
    Sel.active = false;
    var a = Sel.start, b = Sel.end;
    paintSelection();
    if (!a) return;
    openDayModal(a, b && b !== a ? b : null);
  });
  // 【原因】防止長按彈出系統選單，影響掃選
  grid.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });

  $('cbPeriod').addEventListener('change', syncChecks);
  $('cbSafe').addEventListener('change', function () { enforceSexclusive('safe'); });
  $('cbUnsafe').addEventListener('change', function () { enforceSexclusive('unsafe'); });
  $('saveDay').addEventListener('click', saveDayModal);
  $('clearDay').addEventListener('click', clearDayModal);
  $('cancelDay').addEventListener('click', closeDayModal);

  document.querySelectorAll('.fbtn').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.fbtn').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
    });
  });

  $('syncBtn').addEventListener('click', function () {
    $('syncModal').hidden = false;
    switchSyncTab('gen');
  });
  $('closeSync').addEventListener('click', function () { $('syncModal').hidden = true; });
  $('tabGen').addEventListener('click', function () { switchSyncTab('gen'); });
  $('tabMerge').addEventListener('click', function () { switchSyncTab('merge'); });
  $('genSync').addEventListener('click', doGenerateSync);
  $('copySync').addEventListener('click', copySync);
  $('copyLink').addEventListener('click', copySyncLink);
  $('shareSync').addEventListener('click', shareSync);
  $('mergeSync').addEventListener('click', doMergeSync);

  // 【功能】由同步視窗直接跳去備份入口
  // 【原因】兩種傳法要容易切換
  // 【修改指引】唔需要改
  $('openBackup').addEventListener('click', function () {
    $('syncModal').hidden = true;
    if (!$('drawer').classList.contains('open')) toggleDrawer();
    $('exportBtn').scrollIntoView({ block: 'center' });
  });

  $('settingsBtn').addEventListener('click', toggleDrawer);
  $('saveSettings').addEventListener('click', saveSettings);
  $('themeBtn').addEventListener('click', cycleTheme);
  $('themeIcon').addEventListener('click', cycleTheme);
  $('langSel').addEventListener('change', function (ev) { changeLang(ev.target.value); });
  $('exportBtn').addEventListener('click', doExportBackup);
  $('importBtn').addEventListener('click', function () { $('importFile').click(); });
  $('importFile').addEventListener('change', function (ev) { onImportFile(ev.target.files); });
  $('clearAllBtn').addEventListener('click', clearLocalRecords);

  document.querySelectorAll('.overlay').forEach(function (ov) {
    ov.addEventListener('click', function (ev) { if (ev.target === ov) ov.hidden = true; });
  });

  renderAll();
  consumeUrlSync();
  registerServiceWorker();
}

/* 【功能】註冊 service worker（只有 https 或 localhost 才有效）
   【原因】PWA：加到主畫面 + 開一次之後離線都用得
   【修改指引】本機 file:// 會靜靜跳過
   */
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  var secure = location.protocol === 'https:' ||
    location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (!secure) return;
  navigator.serviceWorker.register('./sw.js').catch(function () { /* 失敗唔影響使用 */ });
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>
